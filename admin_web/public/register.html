<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者登録｜VisionAssist</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/register.css">
    
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
        }
      }
    </script>

    <script type="module" src="./js/register.js" defer></script>
    <script type="module" src="./js/style.js" defer></script>
</head>
<body>

    <main class="page-container">
        <div class="register-container">

            <h1>管理者アカウント作成</h1>

            <form id="register-form" class="register-form">

                <div class="form-group">
                    <label for="facility_name">施設名・団体名</label>
                    <input 
                        type="text" 
                        id="facility_name" 
                        name="facility_name"
                        placeholder="例：○○ケアセンター"
                        required
                    >

                    <label for="register_email">管理者メールアドレス（ログイン用）</label>
                    <input 
                        type="email" 
                        id="register_email" 
                        name="register_email"
                        placeholder="example@domain.com"
                        required
                    >

                    <label for="password">パスワード</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="6文字以上の英数字"
                        required
                    >

                    <label for="password_confirm">パスワード（確認用）</label>
                    <input 
                        type="password" 
                        id="password_confirm" 
                        name="password_confirm" 
                        required
                    >
                </div>

                <p id="message" class="message"></p>

                <button type="submit" class="register-button">
                    アカウントを作成する
                </button>

                <div class="login-redirect">
                    <a href="./index.html">ログイン画面に戻る</a>
                </div>
            </form>

        </div>
    </main>

</body>
</html>
