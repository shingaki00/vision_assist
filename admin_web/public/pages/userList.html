<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザ一覧｜VisionAssist</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/userList.css" />
    <script type="module" src="../js/style.js" defer></script>

    <script>
      (function () {
        if (sessionStorage.getItem("uid") === null) {
          window.location.replace("../index.html");
        }
      })();
    </script>
  </head>
  <body>
    <div id="header-inner"></div>

    <main class="page-container">
      <a href="../home.html" class="back-link">← ダッシュボードに戻る</a>
      <h1>ユーザ一覧</h1>

      <div class="search-area">
        <button class="search-icon" id="searchBtn">🔍</button>
        <input
          type="text"
          id="searchBox"
          placeholder="患者名・メールアドレスを検索..."
        />
      </div>
      <div class="user-controles">
        <button id="select-mode">選択</button>
        <button id="select-all" hidden>すべて選択</button>
        <button id="delete-user" hidden>選択したユーザーを削除</button>
      </div>
      <p id="selected-count" hidden>0件選択中</p>
      <div id="patientList"></div>

      <div id="modal" class="modal">
        <div class="modal-content">
          <button id="closeBtn">閉じる</button>
          <div id="detailArea"></div>
        </div>
      </div>
    </main>

    <script src="../js/userList.js"></script>
    <script src="../js/common.js"></script>
  </body>
</html>
