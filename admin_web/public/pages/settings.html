<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/settings.css" />
  </head>
  <body>
    <main>
      <body>
        <div class="container">
          <!-- サイドメニュー -->
          <aside class="sidebar">
            <div class="backButton">
              <a href="../home.html">戻る</a>
            </div>
            <h2>⚙️ 設定</h2>

            <ul class="menu">
              <li class="tab active" data-tab="account">👤 アカウント設定</li>

              <li class="tab" data-tab="notification">🔔 通知設定</li>

              <li class="tab" data-tab="display">🎨 表示設定</li>

              <li class="tab" data-tab="system">ℹ️ システム情報</li>
            </ul>
          </aside>

          <!-- 右側 -->
          <main class="content">
            <div id="account" class="tab-content active">
              <h1>アカウント設定</h1>

              <div class="card">ログインID変更</div>
            </div>

            <div id="notification" class="tab-content">
              <h1>通知設定</h1>

              <div class="card">通知ON/OFF</div>
            </div>

            <div id="display" class="tab-content">
              <h1>表示設定</h1>

              <div class="card">
                <div class="buttonBlock">
                  <p>ダークモード</p>
                  <label class="modeToggle">
                    <input type="checkbox" id="modeSwitch" />
                  </label>
                </div>
              </div>
            </div>

            <div id="system" class="tab-content">
              <h1>システム情報</h1>

              <div class="card">Version 1.0</div>
            </div>
          </main>
        </div>
      </body>
      <script src="../js/settings.js"></script>
    </main>
  </body>
</html>
