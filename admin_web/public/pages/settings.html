<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>設定｜VisionAssist</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/settings.css" />
    <script type="module" src="../js/style.js" defer></script>
  </head>
  <body>
    <div id="header-inner"></div>

    <main class="page-container">
      <a href="../home.html" class="back-link">← ダッシュボードに戻る</a>

      <div class="container">
        <!-- サイドメニュー -->
        <aside class="sidebar">
          <h2>⚙️ 設定</h2>

          <ul class="menu">
            <li class="tab active" data-tab="account">👤 アカウント設定</li>

            <li class="tab" data-tab="notification">🔔 通知設定</li>

            <li class="tab" data-tab="display">🎨 表示設定</li>

            <li class="tab" data-tab="system">ℹ️ システム情報</li>
          </ul>
        </aside>

        <!-- 右側 -->
        <div class="content">
          <div id="account" class="tab-content active">
            <h3>アカウント設定</h3>
            <div class="card">ログインID変更</div>
          </div>

          <div id="notification" class="tab-content">
            <h3>通知設定</h3>

            <div class="card">通知ON/OFF</div>
          </div>

          <div id="display" class="tab-content">
            <h3>表示設定</h3>

            <div class="card">
              <div class="buttonBlock">
                <p>ダークモード</p>
                <label class="modeToggle">
                  <input type="checkbox" id="modeSwitch" />
                </label>
              </div>
            </div>
          </div>

          <div id="system" class="tab-content">
            <h3>システム情報</h3>

            <div class="card">Version 1.0</div>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/settings.js"></script>
  </body>
</html>
