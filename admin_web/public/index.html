<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム</title>

    <!-- 読み込み -->
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/index.js" defer></script>
    <script type="module" src="./js/style.js" defer></script>
    

</head>

<body>
    <div id="header"></div>

    <main class="home-container">

        <div class="quick-access">
            <h3>クイックアクセス</h3>

            <div class="quick-access-list">
                <a href="#" class="quick-card">
                    <div class="icon">👤</div>
                    <div class="text">
                        <h4>ユーザー登録</h4>
                        <p>新規ユーザーの登録・アカウント作成</p>
                    </div>
                    <div class="arrow">›</div>
                </a>
               
                <a href="./walkLog.html" class="quick-card">
                    <div class="icon">📍</div>
                    <div class="text">
                        <h4>歩行ログ確認</h4>
                        <p>利用者の歩行履歴・経路データの確認</p>
                    </div>
                    <div class="arrow">›</div>
                </a>

                <a href="#" class="quick-card">
                    <div class="icon">👥</div>
                    <div class="text">
                        <h4>ユーザー一覧</h4>
                        <p>登録済みユーザーの管理・検索</p>
                    </div>
                    <div class="arrow">›</div>
                </a>

                <a href="#" class="quick-card">
                    <div class="icon">⚙</div>
                    <div class="text">
                        <h4>設定</h4>
                        <p>システム設定・環境設定</p>
                    </div>
                    <div class="arrow">›</div>
                </a>
                
            </div>
            
        </div>

        <div class="activity-feed">
            <h3>最近のアクティビティ</h3>

            <ul class="activity-list" id="activity-list">
                <!-- JavaScriptで動的にアクティビティを追加 -->
            </ul>
            
        </div>

    </main>

</body>
</html>
